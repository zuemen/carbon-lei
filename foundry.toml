[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
libs = ["contracts/lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./contracts/deployments" },
  { access = "read-write", path = "./contracts/deployments" },
  { access = "read", path = "./fixtures" },
]
remappings = [
  "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
  "forge-std/=contracts/lib/forge-std/src/",
]

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[fuzz]
runs = 512

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[lint]
# Time-based validity is the design (validUntil, accreditation, suspension intervals);
# validator timestamp drift of a few seconds does not change any outcome that matters here.
exclude_lints = ["block-timestamp"]

# solc SMTChecker run for P1 and P2 (docs/SECURITY.md §9.2): `FOUNDRY_PROFILE=smt forge build`.
# Analysis only. It compiles the contracts and the test files in contracts/test/smt into separate
# out and cache directories, and the model checker analyses only RegistrySmtHarness, a test-only
# contract that inherits EmissionsClaimRegistry unchanged; the deployed bytecode does not change.
# The checker ignores reverts with custom errors, so it proves nothing about P1 or P2 here and
# its warnings include spurious overflows. Not run in CI.
[profile.smt]
test = "contracts/test/smt"
out = "contracts/out-smt"
cache_path = "contracts/cache-smt"

[profile.smt.model_checker]
contracts = { "contracts/test/smt/RegistrySmtHarness.sol" = ["RegistrySmtHarness"] }
engine = "chc"
targets = ["assert", "overflow"]
timeout = 60000
show_unproved = true
