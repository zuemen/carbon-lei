[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
libs = ["contracts/lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./contracts/deployments" },
  { access = "read-write", path = "./contracts/deployments" },
  { access = "read", path = "./fixtures" },
]
remappings = [
  "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
  "forge-std/=contracts/lib/forge-std/src/",
]

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[fuzz]
runs = 512

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[lint]
# Time-based validity is the design (validUntil, accreditation, suspension intervals);
# validator timestamp drift of a few seconds does not change any outcome that matters here.
exclude_lints = ["block-timestamp"]

# Symbolic check of P1 and P2 (docs/SECURITY.md §9) with the solc SMTChecker:
# `FOUNDRY_PROFILE=smt forge build`. Analysis only; it compiles just the test-only harness
# and does not change the bytecode of the deployed contracts. Results are inconclusive and it is
# not run in CI (see §9.2).
[profile.smt]
test = "contracts/test/smt"
out = "contracts/out-smt"
cache_path = "contracts/cache-smt"

[profile.smt.model_checker]
contracts = { "contracts/test/smt/RegistrySmtHarness.sol" = ["RegistrySmtHarness"] }
engine = "chc"
targets = ["assert", "overflow"]
timeout = 60000
show_unproved = true
