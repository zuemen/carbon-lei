        <h1>CarbonLEI</h1>
        <p>
          This page is an interactive, read-only demo and needs JavaScript. CarbonLEI is a hackathon prototype that makes
          an EU CBAM embedded-emissions report checkable by software. A buyer can check three things about a supplier's
          proof:
        </p>
        <ol>
          <li>Who signed it: the signature recovers to the verification body registered on an Ethereum Sepolia testnet contract.</li>
          <li>Were they authorised: the lead auditor's vLEI role credential chains to an accredited verification body (checked against evidence exported from a local KERI run; the root of trust is simulated in the demo).</li>
          <li>Were these tonnes already claimed: a shared on-chain ledger records how much of the verified tonnage each shipment uses, and the contract refuses a claim beyond it.</li>
        </ol>
        <p>
          All companies, people and LEIs are fictional; emissions values are illustrative, not official CBAM methodology.
          Read more in the <a href="https://github.com/zuemen/carbon-lei#readme">README on GitHub</a>.
        </p>
      </div>
    </noscript>
