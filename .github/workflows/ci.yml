name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test (unit + invariant fuzz, 256 runs x depth 128)
        run: forge test -vv

  halmos:
    name: halmos (bounded symbolic checks of P1, P2, P3, P6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install halmos==0.3.3
      # docs/SECURITY.md §9.2. Every check except check_P1_secondRegistrationThenClaim
      # (7 minutes on the development machine), which `npm run contracts:symbolic` runs.
      - name: Halmos, 10 of 11 checks
        run: npm run contracts:symbolic:quick

  sdk:
    name: sdk (vitest, local anvil chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build contracts (ABI and bytecode for the anvil tests)
        run: forge build
      - name: ABI in sdk/abi.ts matches the contracts
        run: node sdk/scripts/export-abi.ts && git diff --exit-code sdk/abi.ts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -p sdk
      - run: npm test

  slither:
    name: slither (static analysis, fails on high impact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6 crytic-compile==0.4.2
      # Medium and low results are triaged one by one in docs/SECURITY.md (section 5).
      - name: Slither, all default detectors
        run: slither . --compile-force-framework foundry --foundry-out-directory contracts/out --filter-paths "contracts/lib|contracts/test|contracts/script" --fail-high
