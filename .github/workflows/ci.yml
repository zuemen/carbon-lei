name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test (unit + invariant fuzz, 256 runs x depth 128)
        run: forge test -vv

  halmos:
    name: halmos (bounded symbolic checks of P1, P2, P3, P6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install halmos==0.3.3
      # docs/SECURITY.md §9.2. Every check except check_P1_secondRegistrationThenClaim
      # (7 minutes on the development machine), which `npm run contracts:symbolic` runs.
      - name: Halmos, 10 of 11 checks
        run: npm run contracts:symbolic:quick
      # §13.1: the CR1 mitigation in contracts/src/v2 (not deployed), 2 checks, about 3 s after the build.
      - name: Halmos, CR1 mitigation (V2, not deployed)
        run: npm run contracts:symbolic:v2

  maude:
    name: maude (bounded model check of the protocol model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # docs/SECURITY.md §9.3. The Maude 3.5.1 release binary, checked against its SHA-256.
      - name: Install Maude 3.5.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/maude.zip" https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          echo "72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  $RUNNER_TEMP/maude.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maude.zip" -d "$RUNNER_TEMP/maude"
          chmod +x "$RUNNER_TEMP/maude/maude"
      - name: Maude checks (formal/maude/checks.maude, 61 commands)
        run: MAUDE="$RUNNER_TEMP/maude/maude" bash formal/maude/run.sh formal/maude/checks.maude

  sdk:
    name: sdk (vitest, local anvil chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build contracts (ABI and bytecode for the anvil tests)
        run: forge build
      - name: ABI in sdk/abi.ts matches the contracts
        run: node sdk/scripts/export-abi.ts && git diff --exit-code sdk/abi.ts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -p sdk
      - run: npm test

  slither:
    name: slither (static analysis, fails on high impact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6 crytic-compile==0.4.2
      # Medium and low results are triaged one by one in docs/SECURITY.md (section 5).
      - name: Slither, all default detectors
        run: slither . --compile-force-framework foundry --foundry-out-directory contracts/out --filter-paths "contracts/lib|contracts/test|contracts/script" --fail-high
